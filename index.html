<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exo-energetische reacties</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1d1d1b;--mu:#666;--bd:#ddd;--ac:#d9480f;--bl:#1971c2;--gr:#2b8a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#eee;--mu:#aaa;--bd:#3a3a40;--ac:#ff8c5a;--bl:#74b0f0;--gr:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#eee;--mu:#aaa;--bd:#3a3a40;--ac:#ff8c5a;--bl:#74b0f0;--gr:#69db7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}p.s{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.go{background:var(--gr);color:#fff;border-color:var(--gr);font-weight:600}
.eq{font-size:1.15rem;font-weight:600;margin:10px 0 2px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.row>div{flex:1 1 280px;min-width:0}
svg{width:100%;height:auto;display:block}
.t{fill:var(--tx);font-size:13px}.m{fill:var(--mu);font-size:12px}
.cap{font-weight:600;color:var(--ac);min-height:1.5em;margin-top:6px}
.bar{height:14px;background:var(--bd);border-radius:7px;overflow:hidden;margin:3px 0 10px}
.bar>i{display:block;height:100%;width:0}
.lb{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
input[type=range]{width:100%;margin-top:10px}
.net{display:none;padding:10px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px}
li{margin-bottom:8px}
</style>
</head>
<body>
<main>
<h1>Exo-energetische reacties 🔥</h1>
<p class="s">Kies een reactie en druk op <b>Start</b>. Je ziet bindingen breken, nieuwe bindingen ontstaan en wat dat met de energie doet.</p>

<div class="card">
  <div class="tabs" id="tabs"></div>
  <div class="eq" id="eq"></div>
  <div class="m" id="desc"></div>
</div>

<div class="card">
  <svg viewBox="0 0 320 150" role="img" aria-label="Moleculen"><g id="mol"></g></svg>
  <div class="cap" id="cap"></div>
  <input type="range" id="sl" min="0" max="1000" value="0" aria-label="Verloop van de reactie">
  <div style="margin-top:10px"><button class="go" id="go">▶ Start</button> <button id="rs">↺ Opnieuw</button></div>
</div>

<div class="card row">
  <div>
    <svg viewBox="0 0 320 270" role="img" aria-label="Energiediagram">
      <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--mu)"/></marker></defs>
      <line x1="40" y1="250" x2="40" y2="8" stroke="var(--mu)" stroke-width="2" marker-end="url(#ar)"/>
      <line x1="40" y1="250" x2="314" y2="250" stroke="var(--mu)" stroke-width="2" marker-end="url(#ar)"/>
      <text class="m" transform="translate(22,235) rotate(-90)">energie-inhoud (J)</text>
      <text class="m" x="255" y="266">tijd (s)</text>
      <line id="l0" x1="40" x2="135" stroke="var(--gr)" stroke-width="3"/>
      <rect id="b0" x="50" width="85" height="22" fill="var(--card)" stroke="var(--gr)" stroke-width="3"/>
      <text id="t0" class="t" x="92" text-anchor="middle" style="font-size:11px">reagentia</text>
      <line id="ln" x1="135" x2="135" stroke="var(--gr)" stroke-width="3"/>
      <g id="end" opacity="0">
        <line id="l1" x1="305" x2="314" stroke="var(--gr)" stroke-width="3"/>
        <rect id="b1" x="200" width="105" height="22" fill="var(--card)" stroke="var(--gr)" stroke-width="3"/>
        <text id="t1" class="t" x="252" text-anchor="middle" style="font-size:11px">reactieproducten</text>
      </g>
    </svg>
  </div>
  <div style="flex:0 1 150px">
    <svg viewBox="0 0 150 270" role="img" aria-label="Thermometer">
      <g id="thm"><rect x="55" y="15" width="24" height="200" rx="12" fill="none" stroke="var(--mu)" stroke-width="2"/>
      <circle cx="67" cy="230" r="20" fill="var(--ac)"/>
      <rect id="th" x="61" width="12" fill="var(--ac)"/>
      <text class="t" id="tt" x="95" y="130" font-weight="700"></text>
      <text class="m" x="95" y="148">omgeving</text></g>
      <g id="lamp" display="none">
        <g id="rays" stroke="#f59f00" stroke-width="4" stroke-linecap="round">
          <line x1="105" y1="120" x2="119" y2="120"/><line x1="93.9" y1="146.9" x2="103.8" y2="156.8"/><line x1="67" y1="158" x2="67" y2="172"/><line x1="40.1" y1="146.9" x2="30.2" y2="156.8"/>
          <line x1="29" y1="120" x2="15" y2="120"/><line x1="40.1" y1="93.1" x2="30.2" y2="83.2"/><line x1="67" y1="82" x2="67" y2="68"/><line x1="93.9" y1="93.1" x2="103.8" y2="83.2"/>
        </g>
        <circle cx="67" cy="120" r="26" fill="#ffd43b" stroke="#f59f00" stroke-width="3"/>
        <text class="t" x="67" y="200" text-anchor="middle" font-weight="700">licht</text>
        <text class="m" x="67" y="218" text-anchor="middle">energie van buitenaf</text>
      </g>
    </svg>
  </div>
</div>

</main>
<script>
const R=[
{n:"Waterstof + zuurstof",eq:"2 H₂ + O₂ → 2 H₂O",d:"De knalgasreactie: waterstof verbrandt tot water.",
 at:[["H",25,30,218,58],["H",55,30,262,58],["H",25,120,218,128],["H",55,120,262,128],["O",110,75,240,35],["O",145,75,240,105]],
 b0:[[0,1,1],[2,3,1],[4,5,2]],b2:[[4,0,1],[4,1,1],[5,2,1],[5,3,1]],X:1370,Y:1852,t0:20,t1:90},
{n:"Zilverchloride + licht",endo:1,eq:"2 AgCl → 2 Ag + Cl₂",d:"Onder invloed van licht ontbindt zilverchloride tot zilver en chloorgas. Er is voortdurend energie van buitenaf nodig. De bindingen zijn hier vereenvoudigd voorgesteld.",
 at:[["Ag",50,45,200,40],["Cl",90,45,210,110],["Ag",50,110,240,40],["Cl",90,110,245,110]],
 b0:[[0,1,1],[2,3,1]],b2:[[1,3,1]],X:254,Y:0,t0:20,t1:20}];
const $=id=>document.getElementById(id),cl=x=>Math.max(0,Math.min(1,x)),sm=x=>x*x*(3-2*x);
const yOf=e=>250-e*0.95;
const COL={H:["#f1f3f5","#868e96","#222",9],O:["#e03131","#a61e1e","#fff",12],C:["#495057","#212529","#fff",12],Ag:["#ced4da","#868e96","#222",12],Cl:["#40c057","#2b8a3e","#fff",12]};
let cur=0,t=0,raf=null;
function prep(r){ // groepen en gespreide posities (bindingen verbroken)
  const n=r.at.length,g=[...Array(n).keys()];
  const f=i=>g[i]==i?i:(g[i]=f(g[i]));
  r.b0.forEach(([a,b])=>{g[f(a)]=f(b)});
  const c={};r.at.forEach((q,i)=>{const k=f(i);(c[k]=c[k]||[0,0,0]);c[k][0]+=q[1];c[k][1]+=q[2];c[k][2]++});
  r.s1=r.at.map((q,i)=>{const k=f(i),cx=c[k][0]/c[k][2],cy=c[k][1]/c[k][2];return[cx+(q[1]-cx)*1.9,cy+(q[2]-cy)*1.9]});
}
R.forEach(prep);
function pos(r){return r.at.map((q,i)=>{const a=[q[1],q[2]],s=r.s1[i],h=[q[3],q[4]];
  if(t<=.35){const e=sm(t/.35);return[a[0]+(s[0]-a[0])*e,a[1]+(s[1]-a[1])*e]}
  if(t<=.65){const e=sm((t-.35)/.3);return[s[0]+(h[0]-s[0])*e,s[1]+(h[1]-s[1])*e]}
  return h})}
function bonds(list,P,op){if(op<=0)return"";return list.map(([a,b,o])=>{
  const[x1,y1]=P[a],[x2,y2]=P[b],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L*2.5,ny=dx/L*2.5;
  const ln=(u,v)=>`<line x1="${x1+u}" y1="${y1+v}" x2="${x2+u}" y2="${y2+v}" stroke="var(--tx)" stroke-width="2.5" opacity="${op}"/>`;
  return o==2?ln(nx,ny)+ln(-nx,-ny):ln(0,0)}).join("")}
function draw(){
  const r=R[cur],P=pos(r);
  $('mol').innerHTML=bonds(r.b0,P,1-cl(t/.2))+bonds(r.b2,P,cl((t-.75)/.2))+
   r.at.map((q,i)=>{const c=COL[q[0]];return`<circle cx="${P[i][0]}" cy="${P[i][1]}" r="${c[3]}" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/><text x="${P[i][0]}" y="${P[i][1]+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${c[2]}">${q[0]}</text>`}).join("");
  $('cap').textContent=t<=0?"Beginstoffen":t<.35?"① Bindingen in de beginstoffen worden verbroken":t<.65?"② Atomen herschikken":t<1?"③ Nieuwe bindingen worden gevormd":"Reactieproducten";
  // energiediagram: reagentia hoger dan reactieproducten, geen piek
  const hi=r.endo?60:230,lo=r.endo?hi+(r.X-r.Y)*0.2:hi-(r.Y-r.X)*0.2,yh=yOf(hi),yl=yOf(lo),A=(id,o)=>{for(const k in o)$(id).setAttribute(k,o[k])};
  A('l0',{y1:yh,y2:yh});A('b0',{y:yh-11});A('t0',{y:yh+4});
  A('ln',{x2:135+65*t,y1:yh,y2:yh+(yl-yh)*t});
  A('end',{opacity:t>=1?1:0});A('l1',{y1:yl,y2:yl});A('b1',{y:yl-11});A('t1',{y:yl+4});
  const T=r.t0+(r.t1-r.t0)*t,h=(T-10)/100*190;
  A('th',{y:215-h,height:h+5});$('tt').textContent=Math.round(T)+" °C";
  $('thm').style.display=r.endo?'none':'block';$('lamp').style.display=r.endo?'block':'none';
  $('rays').setAttribute('opacity',t>0&&t<1?1:0.2);
  $('sl').value=Math.round(t*1000);
}
function show(i){cur=i;t=0;cancelAnimationFrame(raf);const r=R[i];
  $('eq').textContent=r.eq;$('desc').textContent=r.d;
  [...$('tabs').children].forEach((b,j)=>b.className=j==i?'on':'');draw();}
R.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.n;b.onclick=()=>show(i);$('tabs').appendChild(b)});
$('go').onclick=()=>{cancelAnimationFrame(raf);if(t>=1)t=0;
  const step=()=>{t=Math.min(1,t+0.004);draw();if(t<1)raf=requestAnimationFrame(step)};step()};
$('rs').onclick=()=>show(cur);
$('sl').oninput=e=>{cancelAnimationFrame(raf);t=e.target.value/1000;draw()};
show(0);
</script>
</body>
</html>
